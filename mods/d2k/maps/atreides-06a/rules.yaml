World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, atreides06a.lua, atreides06a-AI.lua
	MissionData:
		Briefing: The Ordos strength grows in the Funeral Plain - reinforcements are pouring in through the Smuggler base.  Strike the base quickly, before fortifications grow too strong.  Destroy the Starport to cut the Ordos off from re-supply, then eradicate the remaining Ordos forces.
		BriefingVideo: A_BR06_E.VQA
	MapOptions:
		TechLevel: medium
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: easy


