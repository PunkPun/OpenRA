World:
	LuaScript:
		Scripts: campaign.lua, utils.lua, proving-grounds.lua
	MissionData:
		WinVideo: sovtstar.vqa
		LossVideo: allymorf.vqa
		Briefing: Information on our new Advanced Tactical Submarine was leaked to the Allies and they have invaded our territory, determined to stop us. You must destroy them. Regain control of our bases as they are revealed by the signal flares. Do not let any Allied attacks stop you. We have received word that a detachment of cruisers is on its way here. Once you recover the sub pen, use the new ATS to prevent the cruisers from destroying our operation.
	ScriptLobbyDropdown@difficulty:
		ID: difficulty
		Label: dropdown-difficulty.label
		Description: dropdown-difficulty.description
		Values:
			easy: options-difficulty.easy
			normal: options-difficulty.normal
			hard: options-difficulty.hard
		Default: normal
	TimeLimitManager:
		SkipTimerExpiredNotification: true

CAMERA.Small:
	Inherits: CAMERA
	RevealsShroud:
		Range: 4c0

CAMERA.Tiny:
	Inherits: CAMERA
	RevealsShroud:
		Range: 2c0

CAMERA.Spotter:
	Inherits: CAMERA
	RevealsShroud:
		Range: 0c512

powerproxy.paratroopers:
	ParatroopersPower:
		DropItems: E1,E1,E1,E4,E4
		SquadSize: 1
		DisplayBeacon: false

# Prevents accidental crate collection by Allied soldiers.
crateblocker:
	AlwaysVisible:
	Immobile:
		OccupiesSpace: true
	Crushable:
		WarnProbability: 0
		CrushClasses: crate
		CrushedByFriendlies: false

HEALCRATE:
	FreeActor:
		Actor: crateblocker

MONEYCRATE:
	FreeActor:
		Actor: crateblocker

